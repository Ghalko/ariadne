[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne"
version = "0.1.0"
description = "Postgres-based repository indexing, graph retrieval, and durable memory for AI coding workflows."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "openai>=1.0.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "sqlalchemy>=2.0.35",
  "typer>=0.12.5",
  "uvicorn>=0.31.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.3",
]
postgres = [
  "pgvector>=0.3.5",
  "psycopg[binary]>=3.2.3",
]
treesitter = [
  "tree-sitter>=0.23.2",
  "tree-sitter-language-pack>=0.10.0",
]

[project.scripts]
ariadne = "ariadne_index.cli:app"
ariadne-mcp = "ariadne_index.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
