[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spinner"
version = "0.1.0"
description = "Local coding runtime fixture repo for Ariadne benchmarking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
spinner = "spinner.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
