[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quay"
version = "0.1.0"
description = "Config-heavy service platform fixture repo for Ariadne benchmarking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
quay = "quay.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
